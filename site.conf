# One file holds everything that differs between the sites of the series.
# Every tool reads it; nothing else carries the site's name or address.
name = devops-aws-vpc
url = https://y-kolyada.github.io/aws-vpc/
topic = AWS VPC
key = aws-vpc
version = 1
# The word the search smoke test types. It must be findable **today**.
# Батч 1 переименовал пятнадцать глав, поэтому слова «Раздел» на русских
# страницах больше нет: слово поиска переведено на термин главы 01, который
# читатель действительно ищет.
search = CIDR
# Сокращения, которые сайт сознательно не объясняет: общее знание инженера
# (интерфейс командной строки, программный интерфейс) и имя серии документов,
# на которую ссылается глава о приватных адресах.
acronyms = API, CLI, RFC
